[project]
name = "agent-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mark Sammons", email = "marksdsammons@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.12",
    "pydantic>=2",
    "streamlit>=1.64.0",
]

[project.scripts]
agent-template = "app:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.build-backend]
module-name = "app"
